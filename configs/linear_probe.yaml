dataset:
  name: cifar10
  root: ./data
  num_classes: 10

probe:
  epochs: 10
  batch_size: 256
  optimizer: adam
  learning_rate: 0.001
  seeds:
    - 42
    - 43
    - 44

knn:
  k:
    - 5
    - 10
    - 20
    - 50
    - 100
  train_limit: 10000
  test_limit: null

checkpoints:
  ae: checkpoints/ae_cifar10.pth
  mae: checkpoints/mae_cifar10.pth

outputs:
  directory: results/exp1
